x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

networks:
  web:
    external: true

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.1ubu2604-ls50
    container_name: jellyfin
    networks:
      - web
    gpus: all
    environment:
      <<: *common-env
      JELLYFIN_PublishedServerUrl: "https://jellyfin.${DOMAIN_NAME}" #optional
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    volumes:
      - ${SSD_PATH}/media-system/jellyfin/config:/config
      - ${SSD_PATH}/media-system/jellyfin/cache:/cache
      - ${HDD_PATH}/media/libraries/shows:/data/tvshows
      - ${HDD_PATH}/media/libraries/movies:/data/movies
      - ${HDD_PATH}/media/libraries/anime:/data/anime
      - ${HDD_PATH}/media/libraries/anime_movies:/data/anime_movies
    restart: unless-stopped
    expose:
      - "8096"

  # Media Organizers
  sonarr:
    image: "lscr.io/linuxserver/sonarr:4.0.20"
    container_name: sonarr
    networks:
      - web
    expose:
      - "8989"
    environment:
      <<: *common-env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SSD_PATH}/media-system/sonarr/config:/config
      - ${HDD_PATH}/media:/media
    depends_on:
      - prowlarr
    restart: unless-stopped

  radarr:
    image: "lscr.io/linuxserver/radarr:6.4.4"
    container_name: radarr
    networks:
      - web
    expose:
      - "7878"
    environment:
      <<: *common-env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SSD_PATH}/media-system/radarr/config:/config
      - ${HDD_PATH}/media:/media
    depends_on:
      - prowlarr
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    networks:
      - web
    expose:
      - "8191"
    environment:
      <<: *common-env
      LOG_LEVEL: debug
      LOG_HTML: true
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: prowlarr
    networks:
      - web
    environment:
      <<: *common-env
    volumes:
      - ${SSD_PATH}/media-system/prowlarr/config:/config
    expose:
      - "9696"
    restart: unless-stopped

  sabnzbdvpn:
    image: binhex/arch-sabnzbdvpn:5
    container_name: sabnzbdvpn
    networks:
      - web
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    privileged: true
    # Web UI (8080/8090) not published: reached only via Caddy -> Authentik.
    # Privoxy/SOCKS and the incoming torrent port stay on the host for the LAN.
    expose:
      - "8080"
    ports:
      - "8118:8118"
      - "9118:9118"
      - "58946:58946"
      - "58946:58946/udp"
    environment:
      <<: *common-env
      VPN_ENABLED: true
      VPN_CLIENT: wireguard
      VPN_PROV: pia
      VPN_USER: ${VPN_USER}
      VPN_PASS: ${VPN_PASS}
      ENABLE_PRIVOXY: true
      STRICT_PORT_FORWARD: true
      ENABLE_SOCKS: true
      SOCKS_USER: ${VPN_USER}
      SOCKS_PASS: ${VPN_PASS}
      LAN_NETWORK: ${LAN_NETWORK}
      NAME_SERVERS: 1.1.1.1,1.0.0.1
    volumes:
      - ${HDD_PATH}/media:/data
      - ${HDD_PATH}/media:/media
      - ${SSD_PATH}/media-system/sabnzbdvpn/config:/config
    restart: unless-stopped

  qbittorrentvpn:
    image: ghcr.io/hotio/qbittorrent:release-5.2.3
    container_name: qbittorrentvpn
    networks:
      web:
        aliases:
          - qbittorrent # sonarr/radarr/prowlarr have the download client configured under this name
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    dns:
      - 1.1.1.1
      - 1.0.0.1
    # Not published: reached only via Caddy, which forward_auths to Authentik.
    expose:
      - "8080"
    environment:
      <<: *common-env
      VPN_ENABLED: "true"
      VPN_TYPE: wireguard
      VPN_PROVIDER: pia
      VPN_PIA_USER: ${VPN_USER}
      VPN_PIA_PASS: ${VPN_PASS}
      VPN_LAN_NETWORK: ${LAN_NETWORK}
    volumes:
      - ${SSD_PATH}/media-system/qbittorrent/config:/config
      - ${HDD_PATH}/media:/media
      - ${HDD_PATH}/stash/downloads:/stash-downloads
    restart: unless-stopped

  # Subtitles
  bazarr:
    image: "lscr.io/linuxserver/bazarr:1.6.1"
    container_name: bazarr
    networks:
      - web
    expose:
      - "6767"
    environment:
      <<: *common-env
    volumes:
      - ${SSD_PATH}/media-system/bazarr/config:/config
      - ${HDD_PATH}/media/libraries/shows:/data/tvshows
      - ${HDD_PATH}/media/libraries/movies:/data/movies
      - ${HDD_PATH}/media/libraries/anime:/data/anime
      - ${HDD_PATH}/media/libraries/anime_movies:/data/anime_movies
    depends_on:
      - jellyfin
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:v3
    container_name: seerr
    init: true
    networks:
      - web
    environment:
      <<: *common-env
      LOG_LEVEL: debug
    # Not published: reached only via Caddy, which forward_auths to Authentik.
    expose:
      - "5055"
    volumes:
      - ${SSD_PATH}/media-system/jellyseerr/config:/app/config
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
