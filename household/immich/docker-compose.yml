#
# Immich for my personal photos (phone backup + Google Photos Takeout), at photos.$DOMAIN_NAME.
# Self-contained: own database, own ML container, own NAS share.
#
# Based on the upstream release compose:
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# Not behind Caddy forward_auth (the mobile app talks to the API directly); login is Authentik OIDC
# only (provider/app "Immich Photos", bound to jeff), password login disabled in Immich's settings.
# Break-glass: docker exec immich_photos_server immich-admin enable-password-login
#
# .env (own file, not the shared one, so the shared secrets stay out of these containers):
#   IMMICH_VERSION, UPLOAD_LOCATION, DB_DATA_LOCATION, DB_PASSWORD, DB_USERNAME, DB_DATABASE_NAME,
#   DB_HOSTNAME, REDIS_HOSTNAME, IMMICH_MACHINE_LEARNING_URL, TZ
#
# The server is also on `web`, where other stacks' "database"/"redis" service names resolve too,
# so DB_HOSTNAME / REDIS_HOSTNAME / the ML URL use these unique container names.
#

name: immich-photos

networks:
  web:
    external: true

services:
  immich-server:
    mem_limit: 14g  # 2026-10-19: ceiling well above observed peak; see docs/runbooks/host.md
    container_name: immich_photos_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    networks:
      - default
      - web
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    mem_limit: 5g  # 2026-10-19: ceiling well above observed peak; see docs/runbooks/host.md
    container_name: immich_photos_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
    volumes:
      - /home/jeff/volumes/immich-photos/model_cache:/cache
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_photos_redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_photos_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false
