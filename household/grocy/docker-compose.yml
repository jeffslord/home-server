networks:
  web:
    external: true

services:
  # groceries
  grocy:
    image: lscr.io/linuxserver/grocy:4.7.1
    container_name: grocy
    networks:
      - web
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${SSD_PATH}/grocy/config:/config
    # Not published: reached only via Caddy, which forward_auths to Authentik.
    expose:
      - "80"
    restart: unless-stopped
