groups:
  - name: flight-site
    rules:
      - alert: FlightSiteDown
        expr: up{job="flight-site"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Public flight site is not answering"
          description: "Prometheus can't scrape flightdensity-public:9102 for 5m. `docker logs flightdensity-public`."

      - alert: FlightSiteErrors
        expr: |
          sum(rate(flightweb_requests_total{status=~"5.."}[10m])) / sum(rate(flightweb_requests_total[10m])) > 0.05
          and sum(rate(flightweb_requests_total[10m])) > 0.01
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Public flight site: {{ $value | humanizePercentage }} of requests failing"
          description: "More than 5% of requests returned 5xx for 10m (503 = too busy). See the Flight site dashboard."

      - alert: FlightDataStale
        expr: flightweb_data_age_seconds > 3600
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Flight data is {{ $value | humanizeDuration }} old"
          description: "No new positions on the public site for over an hour: check flightdensity-collector (OpenSky) and the 15-minute snapshot job in Ofelia."
