global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { instance: homeserver }

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: { instance: homeserver }

  - job_name: nvidia-gpu
    static_configs:
      - targets: ["nvidia-gpu-exporter:9835"]
        labels: { instance: homeserver }

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]

  # Apps probed directly on the docker "web" network. Proves the app itself is up.
  - job_name: blackbox-internal
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://authentik-server:9000/-/health/live/
          - http://jellyfin:8096/health
          - http://open-webui:8080/health
          - http://ollama:11434/
          - http://home-assistant:8123/
          - http://grocy/
          - http://actual-budget:5006/
          - http://sonarr:8989/ping
          - http://radarr:7878/ping
          - http://prowlarr:9696/ping
          - http://bazarr:6767/
          - http://qbittorrentvpn:8080/
          - http://sabnzbdvpn:8080/
          - http://flaresolverr:8191/
          - http://seerr:5055/api/v1/status
          - http://paperless:8000/
          - http://dockhand:3000/
          - http://adguardhome:80/
          - http://ntfy/v1/health
          - http://grafana:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        regex: 'https?://([^:/]+).*'
        target_label: service
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Same apps probed the way a browser sees them: DNS -> public IP -> Caddy -> Authentik.
  # Also where TLS cert expiry comes from. Target list is generated by compose (configs:).
  - job_name: blackbox-external
    metrics_path: /probe
    params:
      module: [http_external]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/blackbox_external.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        regex: 'https://([^.]+)\..*'
        target_label: service
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ["192.168.1.1"]
        labels: { name: router }
      - targets: ["192.168.1.172"]
        labels: { name: nas }
      - targets: ["1.1.1.1"]
        labels: { name: internet }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
