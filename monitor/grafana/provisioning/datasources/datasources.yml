apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000

  # Actual Budget balances by account type, exported nightly by
  # finance/helpers/networth-export.js (Ofelia job actual-networth).
  - name: Actual net worth
    uid: actual-networth
    type: frser-sqlite-datasource
    editable: false
    jsonData:
      path: /var/lib/actual-networth/networth.sqlite
      pathPrefix: "file:"
      pathOptions: "?mode=ro"

  # Garmin Connect health data, fetched by health/garmin (garmin-grafana).
  # uid matches the upstream dashboard after its ${DS_GARMIN_STATS} substitution.
  - name: Garmin InfluxDB
    uid: garmin_influxdb
    type: influxdb
    access: proxy
    url: http://garmin-influxdb:8086
    database: GarminStats
    editable: false
    jsonData:
      httpMode: GET
