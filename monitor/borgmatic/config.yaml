# borgmatic config for the home server (runs in the borgmatic container, see docker-compose.yml)
# Nightly at 02:00 via Ofelia; copied offsite to Google Drive at 03:30 by monitor/offsite-backup.

source_directories:
  - /home/jeff/volumes
  - /home/jeff/flightdensity
  - /home/jeff/development/github.com/home-server   # includes the gitignored .env files
  - /mnt/nas/paperless/media                        # Paperless originals + archived PDFs (DB is dumped below)
  - /mnt/nas/backup/unraid-flash                    # Unraid flash config incl. the disk LUKS keyfile (NAS cron 01:30)
  - /host/etc                                       # eris /etc (fstab, daemon.json, systemd units, ufw, ssh host keys); packages etc. in volumes/monitor/host-state
  # Home-folder items that exist only on eris (not on GitHub, not regenerable)
  - /home/jeff/.claude   # my Claude notes (memory) and past sessions
  - /home/jeff/.ssh   # SSH keys incl. the NAS key; the agent sockets are skipped
  - /home/jeff/.config   # app settings incl. the rclone Drive login
  - /home/jeff/scratch   # Home Assistant helper scripts
  - /home/jeff/llm
  - /home/jeff/rezero-audio
  - /home/jeff/regal-empty
  - /home/jeff/development/local
  - /home/jeff/development/github.com/boyo-bot   # no git remote
  - /home/jeff/development/github.com/social-media-monitor   # not a git repo
  - /home/jeff/development/github.com/actualbudget   # not a git repo

repositories:
  - path: /mnt/nas/backup/home-server-volumes
    label: nas

encryption_passphrase: ${BORG_PASSPHRASE}

compression: zstd

# Borg patterns: first match wins. "-" still descends into the directory,
# so the "+" lines above it can pull individual save folders back in.
patterns:
  # Game servers: saves only, never the multi-GB server installs.
  # Vintage Story and the 12 GB cobblemon_bcg Minecraft world are deliberately left out.
  - "+ /home/jeff/volumes/games/palworld/Pal/Saved"
  - "+ /home/jeff/volumes/games/palworld/backups"
  - "+ /home/jeff/volumes/games/space-engineers/instances"
  - "+ sh:/home/jeff/volumes/games/minecraft/cobbleverse*/world_*"
  - "- /home/jeff/volumes/games"

exclude_patterns:
  # Re-downloadable or regenerable
  - /home/jeff/volumes/ollama
  - /home/jeff/volumes/photon                        # Photon planet geocoder DB (~100 GB, re-downloadable)
  - /home/jeff/volumes/photon-dl                      # its download parts while fetching
  - /home/jeff/volumes/immich/postgres               # Immich DB, dumped below instead
  - /home/jeff/volumes/immich/model_cache            # ML models, re-downloaded on start
  - /home/jeff/volumes/immich-photos/postgres        # Immich DB, dumped below instead
  - /home/jeff/volumes/sure/postgres                 # Sure DB, dumped below instead
  - /home/jeff/volumes/immich-photos/model_cache
  - /home/jeff/volumes/borgmatic/borg-cache
  - /home/jeff/volumes/open-webui                   # chat history not worth keeping
  - /home/jeff/volumes/actual-helpers/cache
  - /home/jeff/volumes/actual-networth/cache
  - /home/jeff/volumes/actual-networth/refresh-cache
  - /home/jeff/volumes/monitor/prometheus
  - /home/jeff/volumes/monitor/loki

  # Media apps: keep settings and databases, skip artwork/metadata caches
  - /home/jeff/volumes/media-system/jellyfin/cache
  - /home/jeff/volumes/media-system/jellyfin/config/data/metadata
  - /home/jeff/volumes/media-system/jellyfin/config/data/data/attachments
  - /home/jeff/volumes/media-system/plex/transcode
  - /home/jeff/volumes/media-system/plex/config/Library/Application Support/Plex Media Server/Cache
  - /home/jeff/volumes/media-system/plex/config/Library/Application Support/Plex Media Server/Media
  - /home/jeff/volumes/media-system/plex/config/Library/Application Support/Plex Media Server/Metadata
  - /home/jeff/volumes/media-system/stash/cache
  - /home/jeff/volumes/media-system/stash/metadata
  - sh:/home/jeff/volumes/media-system/*/config/MediaCover
  - sh:/home/jeff/volumes/media-system/*/config/logs
  - sh:/home/jeff/volumes/media-system/*/config/logs.db*

  # Live databases that are dumped consistently below instead of copied mid-write
  - /home/jeff/volumes/authentik/pgdata
  - /home/jeff/volumes/dawarich/db
  - /home/jeff/volumes/dawarich/redis                # job queue only
  - sh:/home/jeff/volumes/home-assistant/data/home-assistant_v2.db*
  - sh:/home/jeff/volumes/media-system/sonarr/config/sonarr.db*
  - sh:/home/jeff/volumes/media-system/radarr/config/radarr.db*
  - sh:/home/jeff/volumes/media-system/jellyfin/config/data/data/jellyfin.db*
  - sh:/home/jeff/volumes/media-system/stash/config/stash-go.sqlite*   # also skips 7 old 1.3 GB copies
  - sh:/home/jeff/flightdensity/data/flights.db*

  # Flight project: skip the virtualenv, generated output and the 94 MB OpenSky download
  - /home/jeff/flightdensity/.venv
  - /home/jeff/flightdensity/out
  - /home/jeff/flightdensity/noise                  # rebuilt by noise.py --all in ~2 min
  - /home/jeff/flightdensity/cache                  # public site's result cache, rebuilt nightly
  - /home/jeff/flightdensity/data/public            # 15-minute copy of flights.db (dumped above)
  - /home/jeff/flightdensity/ref/aircraftDatabase.csv
  - sh:/home/jeff/flightdensity/**/__pycache__

  # Home-folder projects: virtualenvs and bytecode are rebuilt from requirements
  - sh:/home/jeff/**/.venv
  - sh:/home/jeff/**/__pycache__

  # home-server repo: downloaded test mods
  - /home/jeff/development/github.com/home-server/games/vintage-story/mod-updater/test
  - /home/jeff/development/github.com/home-server/games/vintage-story/mod-updater/test-mods

exclude_caches: true

keep_daily: 7
keep_weekly: 4
keep_monthly: 6

# SQLite: borgmatic streams a consistent dump of each database into the archive.
# Restore with: borgmatic restore --archive latest --database <name>
sqlite_databases:
  - name: home-assistant
    path: /home/jeff/volumes/home-assistant/data/home-assistant_v2.db
  - name: zigbee
    path: /home/jeff/volumes/home-assistant/data/zigbee.db
  - name: flights
    path: /home/jeff/flightdensity/data/flights.db
  - name: grafana
    path: /home/jeff/volumes/monitor/grafana/grafana.db
  - name: actual-account
    path: /home/jeff/volumes/actual-data/server-files/account.sqlite
  - name: actual-budget-1dfbbbd6
    path: /home/jeff/volumes/actual-data/user-files/group-1dfbbbd6-e2ee-4c26-9062-b90c4f059c97.sqlite
  - name: actual-budget-6223ea3f
    path: /home/jeff/volumes/actual-data/user-files/group-6223ea3f-165d-4801-b793-e96ab3137d00.sqlite
  - name: actual-budget-c6ee2246
    path: /home/jeff/volumes/actual-data/user-files/group-c6ee2246-f337-4815-8a5d-9c5d97f9b105.sqlite
  - name: sonarr
    path: /home/jeff/volumes/media-system/sonarr/config/sonarr.db
  - name: radarr
    path: /home/jeff/volumes/media-system/radarr/config/radarr.db
  - name: jellyfin
    path: /home/jeff/volumes/media-system/jellyfin/config/data/data/jellyfin.db
  - name: stash
    path: /home/jeff/volumes/media-system/stash/config/stash-go.sqlite

# PostgreSQL: dumped over the web network (pg_dump ships in the image).
postgresql_databases:
  - name: authentik
    hostname: authentik-postgresql
    username: authentik
    password: ${AUTHENTIK_PG_PASS}
    format: custom
  - name: paperless
    hostname: paperless-db-1
    username: paperless
    password: ${PAPERLESS_DB_PASSWORD}
    format: custom
  - name: dawarich
    hostname: dawarich-db
    username: dawarich
    password: ${DAWARICH_DB_PASSWORD}
    format: custom
  - name: sure_production
    hostname: sure-db
    username: sure
    password: ${SURE_DB_PASSWORD}
    format: custom
  # Immich (both stacks). Restore into the same ghcr.io/immich-app/postgres
  # image (needs the vectorchord/pgvecto.rs extensions). Photo files themselves live on the NAS.
  - name: immich
    label: immich-photos
    hostname: immich_photos_postgres
    username: postgres
    password: ${IMMICH_PHOTOS_DB_PASSWORD}
    format: custom
  - name: immich
    label: immich
    hostname: immich_postgres
    username: postgres
    password: ${IMMICH_DB_PASSWORD}
    format: custom

ntfy:
  topic: unraid
  server: http://ntfy
  access_token: ${NTFY_TOKEN}
  states:
    - fail
  fail:
    title: Home server backup failed
    message: borgmatic failed on eris; see docker logs borgmatic
    priority: high
    tags: floppy_disk
