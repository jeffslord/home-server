# Single-binary Loki, filesystem storage, 30 day retention.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  grpc_server_max_recv_msg_size: 16777216 # first-run backfill bursts exceed the 4MB default
  grpc_server_max_send_msg_size: 16777216

common:
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 30d
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_series: 2000
  allow_structured_metadata: true
  volume_enabled: true # powers the "log volume" bars in Grafana's log browser
  deletion_mode: filter-and-delete # enables POST /loki/api/v1/delete with line filters

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h
  delete_request_cancel_period: 5m # default 24h; how long a delete request stays cancellable before it runs

pattern_ingester:
  enabled: true # pattern detection in Grafana's Logs drilldown

ruler:
  alertmanager_url: http://alertmanager:9093
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
