global:
  resolve_timeout: 5m

route:
  receiver: ntfy
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # Info-level alerts (HostRebooted, SlowEndpoint) get one quiet ping and no repeats.
    - matchers: [severity="info"]
      receiver: ntfy-quiet
      repeat_interval: 7d

# A critical alert on an instance silences warnings for the same instance.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity=~"warning|info"]
    equal: [instance]
  # If the scrape target itself is down, its derived alerts are noise.
  - source_matchers: [alertname="TargetDown"]
    target_matchers: [alertname!="TargetDown"]
    equal: [instance]

receivers:
  - name: ntfy
    webhook_configs:
      # ../ntfy/templates/homeserver.yml formats the message and sets priority from severity.
      - url: http://ntfy/home_alerts?template=homeserver&tags=rotating_light
        send_resolved: true
        http_config:
          basic_auth:
            username: alertmanager
            password_file: /run/secrets/ntfy_alertmanager_password

  - name: ntfy-quiet
    webhook_configs:
      - url: http://ntfy/home_alerts?template=homeserver&tags=information_source
        send_resolved: false
        http_config:
          basic_auth:
            username: alertmanager
            password_file: /run/secrets/ntfy_alertmanager_password
