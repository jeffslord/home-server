# Schedules: sec min hour day month weekday, in ${TZ} (America/New_York).

# Sync investment/401k balances from SimpleFIN into Actual (finance/helpers).
[job-run "actual-track-investments"]
schedule = 0 15 6 * * *
container = actual-helpers
delete = false

# Regenerate the PHL overflight charts and publish them to HA /local/flights
# (~/flightdensity, outside this repo).
[job-run "flightdensity-report"]
schedule = 0 20 0 * * *
container = flightdensity-report
delete = false

# Jellyfin starts a new dated log file at midnight; reload the jail so it follows it.
[job-exec "fail2ban-reload-jellyfin"]
schedule = 0 2 0 * * *
container = fail2ban
command = fail2ban-client reload jellyfin-auth

# Export Actual balances by account type for Grafana's "Net worth" dashboard
# (finance/helpers networth-export.js). Hourly so edits in Actual show up soon;
# the 06:30 run picks up the 06:15 investment sync.
[job-run "actual-networth"]
schedule = 0 30 * * * *
container = actual-networth
delete = false

# Nightly borg backup of volumes, flight data and this repo to the NAS
# (monitor/borgmatic). Alerts on the ntfy `unraid` topic if it fails; the NAS
# also alerts at 09:00 if the repo is >30 h old (catches this job not running).
[job-run "borgmatic"]
schedule = 0 0 2 * * *
container = borgmatic
delete = false

# Copy the borg repo (monitor/borgmatic, 02:00) to Google Drive
# (monitor/offsite-backup). Alerts on the ntfy `unraid` topic if it fails.
[job-run "offsite-backup"]
schedule = 0 30 3 * * *
container = offsite-backup
delete = false
