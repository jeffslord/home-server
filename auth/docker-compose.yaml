networks:
  web:
    external: true

services:
  postgresql:
    container_name: authentik-postgresql
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    networks:
      - web
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - ${SSD_PATH}/authentik/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}

  authentik-server:
    container_name: authentik-server
    image: ghcr.io/goauthentik/server:2026.8.3
    restart: unless-stopped
    command: server
    networks:
      - web
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    volumes:
      - ${SSD_PATH}/authentik/data:/data # 2025.12+: file storage root (was /media)
      - ${SSD_PATH}/authentik/custom-templates:/templates
    # Not published: Caddy proxies authentik.${DOMAIN_NAME} to authentik-server:9000
    # over the docker network, and every outpost callback goes through Caddy too.
    expose:
      - "9000"
    depends_on:
      postgresql:
        condition: service_healthy

  authentik-worker:
    container_name: authentik-worker
    image: ghcr.io/goauthentik/server:2026.8.3
    restart: unless-stopped
    command: worker
    networks:
      - web
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    # No docker socket / root: only the embedded outpost is used, so the worker
    # never needs to manage outpost containers.
    volumes:
      - ${SSD_PATH}/authentik/data:/data # 2025.12+: file storage root (was /media)
      - ${SSD_PATH}/authentik/certs:/certs
      - ${SSD_PATH}/authentik/custom-templates:/templates
    depends_on:
      postgresql:
        condition: service_healthy
