# Local LLMs: Ollama (GPU) and Open WebUI (open-webui.$DOMAIN_NAME, Authentik OIDC).
# Ollama also serves Paperless AI, Sure, OpenCode and Home Assistant.
# Moved here from ~/llm on 2026-10-19; `name: llm` keeps the original compose
# project so the existing containers are recognised.
name: llm

networks:
  web:
    external: true

services:
  ollama:
    mem_limit: 12g  # 2026-10-19: ceiling well above observed peak; see docs/runbooks/host.md
    networks:
      - web
    volumes:
      - ${SSD_PATH}/ollama:/root/.ollama
    container_name: ollama
    tty: true
    restart: unless-stopped
    # Pinned. `:latest` with pull_policy: always pulled 0.34.2 on 2026-09-17,
    # which requires NVIDIA driver >= 550; the host had 535 and Ollama silently
    # fell back to CPU. Bump deliberately and check `ollama ps` shows GPU after.
    image: ollama/ollama:0.34.2
    environment:
      # Default is 4096, which is far too small for an agent (OpenCode) that
      # sends the system prompt + tool schemas + file contents every turn.
      # 16k with a 7B Q4 model fits in the 1080's 8 GB with room to spare; the
      # 8B model only fits at 16k if the KV cache is quantized to q8_0.
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_KEEP_ALIVE: "5m" # unload sooner so Jellyfin/Whisper get the GPU back
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_FLASH_ATTENTION: "1" # required for a quantized KV cache
    # Host-only: Ollama has no auth of its own. open-webui reaches it at
    # http://ollama:11434 over the `web` network; the opencode CLI on this host
    # uses 127.0.0.1:11434. Nothing on the LAN can reach it.
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            # CDI so the GPU survives `systemctl daemon-reload` (docs/runbooks/host.md "GPU").
            - driver: cdi
              device_ids: [nvidia.com/gpu=all]
              capabilities:
                - gpu

  open-webui:
    mem_limit: 3g  # 2026-10-19: ceiling well above observed peak; see docs/runbooks/host.md
    networks:
      - web
    image: ghcr.io/open-webui/open-webui:0.12
    container_name: open-webui
    volumes:
      - ${SSD_PATH}/open-webui/data:/app/backend/data
    depends_on:
      - ollama
    # No host port: reached only via Caddy (open-webui.<domain>) so the Authentik
    # OIDC login can't be bypassed on the LAN.
    environment:
      # Container name over the shared `web` network: no host port or Caddy route needed.
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'AUTOMATIC1111_BASE_URL=http://host.docker.internal:7860/'
      - 'WEBUI_SECRET_KEY=${OPEN_WEBUI_SECRET_KEY}'
      - 'ENABLE_IMAGE_GENERATION=True'
      # - 'WEBUI_AUTH=False'
      # SSO via Authentik OIDC (application "open-webui"). Existing accounts are
      # merged by email. Roles come from Authentik groups: "Open WebUI Admins" -> admin,
      # "Open WebUI Users" -> user, anyone else -> pending (needs approval).
      # The email/password form stays as a fallback.
      - 'WEBUI_URL=https://open-webui.${DOMAIN_NAME}'
      - 'ENABLE_OAUTH_SIGNUP=true'
      - 'OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true'
      - 'OAUTH_PROVIDER_NAME=Authentik'
      - 'OAUTH_CLIENT_ID=open-webui'
      - 'OAUTH_CLIENT_SECRET=${OPEN_WEBUI_OIDC_CLIENT_SECRET}'
      - 'OPENID_PROVIDER_URL=https://authentik.${DOMAIN_NAME}/application/o/open-webui/.well-known/openid-configuration'
      - 'OPENID_REDIRECT_URI=https://open-webui.${DOMAIN_NAME}/oauth/oidc/callback'
      - 'OAUTH_SCOPES=openid email profile'
      - 'ENABLE_OAUTH_ROLE_MANAGEMENT=true'
      - 'OAUTH_ROLES_CLAIM=groups'
      - 'OAUTH_ALLOWED_ROLES=Open WebUI Users,Open WebUI Admins'
      - 'OAUTH_ADMIN_ROLES=Open WebUI Admins'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
